# PyrosEco - Mosquitto yapılandırması (Docker: docker-compose.yml)
# Yalnızca kimliği doğrulanmış servisler bağlanır; kim hangi konuya yazabilir "acl" dosyasında.
# Şifre dosyası: node scripts/mqtt-kullanicilar.ts (.env'deki şifrelerden üretir, git'e girmez)
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence false
log_dest stdout
