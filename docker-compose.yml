services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pyros-mosquitto
    ports:
      - "1883:1883" # MQTT
      - "9001:9001" # MQTT over WebSocket (opsiyonel)
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
