services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pyros-mosquitto
    ports:
      - "127.0.0.1:1883:1883" # MQTT, yalnizca bu bilgisayardan
    volumes:
      # mosquitto.conf + acl + passwd (passwd: pnpm mqtt:users)
      - ./mosquitto/config:/mosquitto/config:ro
    restart: unless-stopped
