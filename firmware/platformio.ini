; PyrosEco - ESP32 sensor dugumu (NODE_ID 50)
; Wokwi simulasyonu:  pio run -e wokwi   (sonra diagram.json -> "Wokwi: Start Simulator")
; Gercek kart:        include/secrets.h olusturun -> pio run -e esp32dev -t upload

[platformio]
default_envs = wokwi

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:wokwi]
build_flags = -DWOKWI

[env:esp32dev]
